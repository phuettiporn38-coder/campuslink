name: CampusLink CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Lint & Code Style Verification
  # -------------------------------------------------------------
  lint-and-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run lint

  # -------------------------------------------------------------
  # Job 2: Automated Test Cases (Vitest Test Suite)
  # -------------------------------------------------------------
  test-suite:
    name: 🧪 Run Unit & Integration Tests (13 Test Cases)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Vitest Tests
        run: npm test

  # -------------------------------------------------------------
  # Job 3: Build Web App & Bundle Verification
  # -------------------------------------------------------------
  build:
    name: 📦 Production Build & Asset Packaging
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets (Vite)
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          retention-days: 7

  # -------------------------------------------------------------
  # Job 4: Continuous Deployment (CD) Preview / Release
  # -------------------------------------------------------------
  deploy-preview:
    name: 🚀 Deploy & Release Check
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist

      - name: Verify Deployment Bundle
        run: |
          echo "Verifying production build bundle..."
          ls -la dist/
          test -f dist/index.html && echo "✅ Index file generated successfully."

      - name: Deployment Success Notification
        run: |
          echo "🚀 CI/CD Pipeline Passed Successfully!"
          echo "Commit: ${{ github.sha }} | Branch: ${{ github.ref_name }}"
